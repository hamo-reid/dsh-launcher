name: Release

# 打 `v*` tag 时：跑完整检查 → 用 electron-builder 打包 Windows 分发物
# （portable 单文件 + win-unpacked 目录 zip）→ 上传到 GitHub Release。
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 创建 Release / 上传资产

jobs:
  release:
    name: Package & publish
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm run build

      # 版本对齐校验：electron-builder 依据 package.json 的 version 命名产物
      # （如 Dsh-Launcher-0.1.0-portable.exe），所以 tag 必须与它一致。
      - name: Validate tag matches package.json version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            throw "Tag v$tag does not match package.json version $pkg — bump the version first."
          }

      # electron-builder 按 package.json「build」配置产出 portable + win-unpacked
      # 到 release/；--publish never 禁止它自行发布（由本 workflow 显式上传）。
      - name: Package Windows distributables
        run: pnpm exec electron-builder --win --publish never

      - name: Zip the unpacked directory
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked -DestinationPath release/Dsh-Launcher-win-unpacked.zip

      # 用 gh CLI 创建 Release：正文从 docs/releases/<tag>.md 读取（中英、中文在前），
      # 与 annotated tag 的 message 一致，保证 tag 页与 Release 页同步。
      # gh 在 GitHub-hosted runner 预装；--notes-file 读文件可靠，且沿用 github.token。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path $notes)) { throw "changelog not found: $notes" }
          gh release delete $tag --yes 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "no existing release to delete" }
          $files = @()
          $files += Get-ChildItem -Path release -Filter 'Dsh-Launcher-*.exe' | ForEach-Object { $_.FullName }
          $files += (Get-Item 'release/Dsh-Launcher-win-unpacked.zip').FullName
          gh release create $tag @files --notes-file $notes --title $tag